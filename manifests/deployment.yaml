
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exco-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: exco-app
  template:
    metadata:
      labels:
        app: exco-app
    spec:
      containers:
        - name: exco-app
          image: ghcr.io/seannez/exco-devops-exercise:a82473ab7a1b21b471a6b364b4a84a1f2671f4aa
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
