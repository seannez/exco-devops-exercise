apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exco-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seannez/exco-devops-exercise.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: exco-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
