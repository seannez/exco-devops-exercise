
name: Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/seannez/exco-devops-exercise:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/seannez/exco-devops-exercise
      
      
      - name: Update image tag in Git
        run: |
          sed -i -E "s|(^[[:space:]]*image:).*|\1 ghcr.io/seannez/exco-devops-exercise:${GITHUB_SHA}|" manifests/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifests/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "ci: deploy image ${GITHUB_SHA}"
            git push origin HEAD:main
          fi

